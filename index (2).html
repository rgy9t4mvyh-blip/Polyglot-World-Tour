<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polyglot World Tour</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#2f6fed;--ok:#1e9e5a;--bad:#d64545;--bd:#e3ded2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mut:#9aa3b2;--ac:#6c9bff;--ok:#43c283;--bad:#ef6b6b;--bd:#2e3442}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mut:#9aa3b2;--ac:#6c9bff;--ok:#43c283;--bad:#ef6b6b;--bd:#2e3442}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px}
.pass{display:flex;gap:8px;margin-bottom:14px}
.stamp{flex:1;text-align:center;border:2px dashed var(--bd);border-radius:12px;padding:8px 2px;font-size:.78rem;color:var(--mut)}
.stamp b{display:block;font-size:1.5rem;filter:grayscale(1);opacity:.35}
.stamp.cur{border-color:var(--ac);color:var(--tx)}
.stamp.got{border:2px solid var(--ok);color:var(--tx)}
.stamp.got b{filter:none;opacity:1}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.tag{font-size:.82rem;font-weight:600;color:var(--ac);margin:0 0 6px}
.q{font-size:1.12rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.fb{margin:4px 0 14px;color:var(--mut);min-height:1.4em}
.btn{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}
.big{font-size:3rem;margin:0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌍 Polyglot World Tour</h1>
  <p class="sub">Игра по четырём видео Unit 2: When in Rome, speak as the Romans do</p>
  <div class="pass" id="pass"></div>

  <div id="intro" class="card">
    <p class="big" id="ie"></p>
    <h2 id="it" style="margin:0 0 6px"></h2>
    <p class="sub" id="id"></p>
    <button class="btn" id="go">Поехали</button>
  </div>

  <div id="game" class="card hide">
    <div class="bar"><span id="st"></span><span id="sc"></span></div>
    <p class="tag" id="tag"></p>
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hide" id="next">Дальше →</button>
  </div>

  <div id="end" class="card hide">
    <p class="big" id="em"></p>
    <h2 id="title" style="margin:0 0 8px"></h2>
    <p id="res"></p>
    <button class="btn" id="again">Новое путешествие</button>
  </div>
</div>

<script>
var ST=[
{e:"🗣️",n:"Video 1",t:"Best way to learn a foreign language: 7 quick tips",d:"From working with native speakers to reading newspapers: you can learn Spanish, German, Chinese, Portuguese, English and any other language.",
 q:[
 {q:"Which two ways of learning are mentioned in the video?",a:["Working with native speakers and reading newspapers","Only memorising grammar tables","Only watching films without subtitles","Avoiding speaking until you are perfect"],c:0,x:"The video lists working with native speakers and reading newspapers among its tips."},
 {q:"How many quick tips does the video give?",a:["3","5","7","10"],c:2,x:"It is “7 quick tips”."},
 {q:"Which languages can you learn with these tips?",a:["Only European languages","Only English","Only Chinese","Spanish, German, Chinese, Portuguese, English and any other"],c:3,x:"The tips work for any language."}]},
{e:"🧠",n:"Video 2",t:"7 tips to learn and master any foreign language",d:"Choose the technique you like the best. Probably you are using some of them?",
 q:[
 {q:"How many tips does this video offer?",a:["7","4","12","20"],c:0,x:"The title says 7 tips."},
 {q:"Which technique should you choose?",a:["The most expensive one","The one you like the best","The one your friends use","The shortest one"],c:1,x:"The video advises choosing the technique you like the best."}]},
{e:"🏅",n:"Video 3",t:"Three surprising benefits of learning a new language (Alex Rawlings)",d:"Britain’s most multilingual student in 2012, Alex Rawlings, lists some of the benefits.",
 q:[
 {q:"Which of these is NOT one of the benefits mentioned?",a:["Improves employment chances","Improves mental health","Improves brain power","Makes you run faster"],c:3,x:"The three benefits are employment chances, mental health and brain power."},
 {q:"By how many years on average can learning a language delay dementia?",a:["1.5 years","4.5 years","10 years","20 years"],c:1,x:"Research shows an average delay of 4.5 years."},
 {q:"Which health service recommends learning a language to fight depression?",a:["WHO","UNESCO","NHS","NASA"],c:2,x:"The NHS recommends it."},
 {q:"People who learn languages are also good at…",a:["Only word puzzles","Maths and arithmetic","Only music","Nothing else"],c:1,x:"They are good not just at word puzzles, but also at maths."}]},
{e:"🌎",n:"Video 4",t:"Teen speaks over 20 languages (Tim Doner)",d:"Hyper-polyglot Tim Doner has been teaching himself languages since he was 13 and takes you on a cultural tour of New York.",
 q:[
 {q:"At what age did Tim begin teaching himself languages?",a:["5","9","13","18"],c:2,x:"He started at the age of 13."},
 {q:"Roughly how many languages does Tim speak?",a:["Two","Five","About twenty","More than a hundred"],c:2,x:"He speaks nearly 20 languages or more."},
 {q:"Which city is Tim’s cultural tour about?",a:["London","New York","Sydney","Moscow"],c:1,x:"The video is a cultural tour of New York."},
 {q:"What is Tim called because he speaks so many languages?",a:["A hyper-polyglot","A translator only","A tour guide","A dictionary"],c:0,x:"A hyper-polyglot is a person who speaks many languages fluently."}]}
];
var s,qi,score,streak,got,ok;
function $(x){return document.getElementById(x)}
function show(x){["intro","game","end"].forEach(function(k){$(k).classList.toggle("hide",k!==x)})}
function pass(){$("pass").innerHTML=ST.map(function(o,k){return '<div class="stamp'+(got[k]?" got":(k===s?" cur":""))+'"><b>'+o.e+'</b>'+o.n+'</div>'}).join("")}
function start(){s=0;score=0;streak=0;got=[false,false,false,false];station()}
function station(){
  pass();var o=ST[s];ok=0;qi=0;
  $("ie").textContent=o.e;$("it").textContent=o.n+": "+o.t;$("id").textContent=o.d;
  $("go").textContent=s===0?"Поехали":"Дальше по маршруту";show("intro");
}
function render(){
  var o=ST[s],q=o.q[qi];pass();
  $("st").textContent=o.n+" · "+(qi+1)+"/"+o.q.length;$("sc").textContent="Очки: "+score;
  $("tag").textContent=o.t;$("q").textContent=q.q;$("fb").textContent="";$("next").classList.add("hide");
  var box=$("opts");box.innerHTML="";
  q.a.forEach(function(t,k){var b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=function(){pick(b,k,q)};box.appendChild(b)});
  show("game");
}
function pick(b,k,q){
  var all=$("opts").children,i;
  for(i=0;i<all.length;i++)all[i].disabled=true;
  all[q.c].classList.add("ok");
  if(k===q.c){ok++;streak++;score+=10+Math.min(10,(streak-1)*2);$("fb").textContent="✅ "+q.x+(streak>1?" Серия: "+streak+" 🔥":"")}
  else{streak=0;b.classList.add("bad");$("fb").textContent="❌ "+q.x}
  $("sc").textContent="Очки: "+score;
  var last=qi===ST[s].q.length-1;
  $("next").textContent=last?(s===3?"Итог →":"Получить штамп →"):"Дальше →";$("next").classList.remove("hide");
}
function next(){
  var o=ST[s];
  if(qi<o.q.length-1){qi++;render();return}
  got[s]=ok/o.q.length>=0.6;pass();
  if(s===3){finish();return}
  s++;station();
}
function finish(){
  var n=got.filter(Boolean).length;
  $("em").textContent=n===4?"🏆":n>=2?"🎓":"📚";
  $("title").textContent=n===4?"Hyper-polyglot!":n===3?"Polyglot":n===2?"Bilingual":"Beginner";
  $("res").textContent="Штампов в паспорте: "+n+" из 4. Очки: "+score+"."+(n<4?" Пересмотри видео без штампа и попробуй ещё раз.":" Ты собрал все штампы!");
  show("end");
}
$("go").onclick=function(){render()};$("next").onclick=next;$("again").onclick=start;
start();
</script>
</body>
</html>
